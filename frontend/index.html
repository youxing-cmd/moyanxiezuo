<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>九章写作 - 专业AI小说创作平台</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366f1'/><text x='50' y='68' font-size='55' font-family='system-ui' fill='white' text-anchor='middle' font-weight='600'>九</text></svg>">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/editor.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/modals.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Sentry 错误监控（免费版） -->
    <script src="https://browser.sentry-cdn.com/8.54.0/bundle.tracing.min.js" crossorigin="anonymous"></script>
    <script>
        window.SENTRY_DSN = 'https://f601b4cf1686790f941dabb362a2f206@o4511369746972672.ingest.us.sentry.io/4511369773187072';
        if (window.SENTRY_DSN && typeof Sentry !== 'undefined') {
            Sentry.init({
                dsn: window.SENTRY_DSN,
                tracesSampleRate: 0.2,
                environment: 'production',
            });
        }
    </script>
</head>
<body>
    <div class="app">
        <!-- 登录/注册层 -->
        <div class="auth-overlay" id="authOverlay" style="display:none;">
            <div class="auth-box">
                <div class="auth-header">
                    <div class="auth-logo">
                        <span class="logo-icon" id="authLogoIcon">
                            <svg width="36" height="36" viewBox="0 0 40 40" style="display:block;">
                                <text x="20" y="28" font-size="22" font-family="'Noto Serif SC', serif" fill="white" text-anchor="middle" font-weight="700">九</text>
                            </svg>
                        </span>
                        <span id="authLogoText">九章写作</span>
                    </div>
                    <p class="auth-subtitle">AI 辅助小说创作平台</p>
                </div>
                <div class="auth-tabs" id="authTabs">
                    <button class="auth-tab active" data-tab="login">登录</button>
                    <button class="auth-tab" data-tab="register">注册</button>
                </div>
                <form class="auth-form" id="authForm" onsubmit="return false;">
                    <div style="display:flex; margin-bottom:16px; border-bottom:1px solid var(--border);">
                        <button type="button" class="login-subtab active" data-subtab="password" style="flex:1; padding:10px 8px; border:none; background:transparent; color:var(--text-primary); font-size:13px; cursor:pointer; border-bottom:2px solid var(--accent);">密码登录</button>
                        <button type="button" class="login-subtab" data-subtab="code" style="flex:1; padding:10px 8px; border:none; background:transparent; color:var(--text-muted); font-size:13px; cursor:pointer; border-bottom:2px solid transparent;">验证码登录</button>
                    </div>
                    <div id="loginPasswordForm" style="display:block;">
                        <div class="form-group">
                            <label class="form-label">手机号</label>
                            <input type="text" class="form-input" id="loginPhone" placeholder="请输入手机号" autocomplete="tel">
                        </div>
                        <div class="form-group">
                            <label class="form-label">密码</label>
                            <input type="password" class="form-input" id="loginPassword" placeholder="请输入密码" autocomplete="current-password">
                        </div>
                        <button type="button" class="btn btn-primary" id="btnLoginPassword" style="width:100%; margin-top:8px;">登录</button>
                    </div>
                    <div id="loginCodeForm" style="display:none;">
                        <div class="form-group">
                            <label class="form-label">手机号</label>
                            <input type="text" class="form-input" id="loginCodePhone" placeholder="请输入手机号" autocomplete="tel">
                        </div>
                        <div class="form-group">
                            <label class="form-label">验证码</label>
                            <div style="display:flex; gap:8px;">
                                <input type="text" class="form-input" id="loginCodeInput" placeholder="请输入验证码" autocomplete="one-time-code" style="flex:1;">
                                <button type="button" class="btn btn-ghost" id="btnSendCode" style="white-space:nowrap; font-size:12px; padding:8px 12px;">获取验证码</button>
                            </div>
                        </div>
                        <button type="button" class="btn btn-primary" id="btnLoginCode" style="width:100%; margin-top:8px;">登录</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 左侧导航栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon" id="sidebarLogoIcon">
                        <svg width="36" height="36" viewBox="0 0 40 40" style="display:block;">
                            <text x="20" y="28" font-size="22" font-family="'Noto Serif SC', serif" fill="white" text-anchor="middle" font-weight="700">九</text>
                        </svg>
                    </span>
                    <span class="logo-text" id="sidebarLogoText">九章写作</span>
                </div>
                <p class="logo-subtitle">AI 辅助小说创作平台</p>
            </div>

            <nav class="nav-menu">
                <div class="nav-section">
                    <span class="nav-label">创作</span>
                    <a href="#" class="nav-item active" data-page="works">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                        <span>我的作品</span>
                    </a>
                </div>

                <div class="nav-section">
                    <span class="nav-label">工具</span>
                    <a href="#" class="nav-item" data-page="ai-tools">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                        <span>AI 工具库</span>
                    </a>
                    <a href="#" class="nav-item" data-page="trends">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
                        <span>热文赛道</span>
                    </a>
                </div>

                <div class="nav-section">
                    <span class="nav-label">灵感</span>
                    <a href="#" class="nav-item" data-page="inspiration">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
                        <span>灵感库</span>
                    </a>
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="user-card" onclick="handleUserCardClick()" style="cursor:pointer;" title="个人中心">
                    <div class="user-avatar">作</div>
                    <div class="user-info">
                        <span class="user-name">创作者</span>
                        <span class="user-status">专业版会员</span>
                    </div>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-muted); margin-left:auto;">
                        <polyline points="9 18 15 12 9 6"/>
                    </svg>
                </div>
                <div class="token-info" id="sidebarPointsInfo" style="display:none;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                        <span style="font-size:11px; color:var(--text-muted);">💎 积分</span>
                        <span style="font-size:11px; color:var(--accent); font-weight:600;" id="sidebarPoints">0</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-size:11px; color:var(--text-muted);" id="sidebarSubType">免费版</span>
                        <span style="font-size:10px; color:var(--text-muted);" id="sidebarSubExpire"></span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 顶部栏 -->
            <header class="topbar">
                <h1 class="page-title" id="pageTitle">概览</h1>
                <div class="topbar-actions">
                    <div class="theme-switcher">
                        <button class="btn btn-ghost" id="themeBtn" onclick="toggleThemeMenu()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="themeIcon">
                                <circle cx="12" cy="12" r="5"/>
                                <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                            </svg>
                            <span id="themeLabel">暖色</span>
                        </button>
                        <div class="theme-dropdown" id="themeDropdown">
                            <div class="theme-option" data-theme="dark" onclick="setTheme('dark')">
                                <span class="theme-dot" style="background:#0f0f12;"></span>
                                <span>深色</span>
                            </div>
                            <div class="theme-option" data-theme="light" onclick="setTheme('light')">
                                <span class="theme-dot" style="background:#f5f5f7;"></span>
                                <span>浅色</span>
                            </div>
                            <div class="theme-option" data-theme="warm" onclick="setTheme('warm')">
                                <span class="theme-dot" style="background:#f7f2e8;"></span>
                                <span>暖色</span>
                            </div>
                        </div>
                    </div>
                    <button class="btn btn-ghost" id="topbarPointsBtn" onclick="showPointsDetail()" title="积分" style="display:none;">
                        <span id="topbarPoints">💎 0</span>
                    </button>
                    <button class="btn btn-ghost" onclick="showToast('暂无新通知', 'info')" title="通知">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                    </button>
                    <button class="btn btn-primary" onclick="showCreateWorkModal()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        新建作品
                    </button>
                </div>
            </header>

            <!-- 页面内容 -->
            <div class="content" id="contentArea">
                <!-- 内容通过JS动态加载 -->
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
    <script src="js/state.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/editor-core.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script src="js/page-utils.js"></script>
    <script src="js/pages/dashboard.js"></script>
    <script src="js/pages/works.js"></script>
    <script src="js/pages/writing.js"></script>
    <script src="js/demo/writing-views.js"></script>
    <script src="js/pages/inspiration.js"></script>
    <script src="js/pages/workflow.js"></script>
    <script src="js/pages/trends.js"></script>
    <script src="js/pages/center.js"></script>
    <script src="js/pages/analytics.js"></script>
    <script src="js/pages/profile.js"></script>
    <script src="js/pages/model-configs.js"></script>
    <script src="js/pages/work-detail.js"></script>
    <script src="js/interactions-works.js"></script>
    <script src="js/interactions-writing.js"></script>
    <script src="js/interactions-ai.js"></script>
    <script src="js/interactions-content.js"></script>
    <script src="js/interactions-core.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
